<script>
(function(){
// Bunny-style SVG animal generator. Palette matches the page bunnies:
// body #ffb3d9, accent #ff8cc4, light #ffd1e8, outline #b02a73, eyes #6b1f4d.
var PAL={b:'#ffb3d9',a:'#ff8cc4',l:'#ffd1e8',o:'#b02a73',e:'#6b1f4d',w:'#fff',n:'#ff4894'};
function E(x,y,rx,ry,f){return '<ellipse cx="'+x+'" cy="'+y+'" rx="'+rx+'" ry="'+ry+'" fill="'+f+'" stroke="'+PAL.o+'" stroke-width="2"/>';}
function C(x,y,r,f){return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+f+'" stroke="'+PAL.o+'" stroke-width="2"/>';}
function Cd(x,y,r){return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+PAL.e+'"/>';}
function P(d,f,w){return '<path d="'+d+'" fill="'+f+'" stroke="'+PAL.o+'" stroke-width="'+(w||2)+'" stroke-linecap="round" stroke-linejoin="round"/>';}
function PL(d,w,wd){return '<path d="'+d+'" fill="none" stroke="'+(w||PAL.o)+'" stroke-width="'+(wd||2)+'" stroke-linecap="round"/>';}
function eyes(x,y,g){return Cd(x-g,y,1.8)+Cd(x+g,y,1.8);}
function ears(t,hx,hy){
  if(t==='long')return E(hx-6,hy-16,4.5,11,PAL.a)+E(hx-6,hy-16,1.8,6.5,PAL.l)+E(hx+5,hy-16,4.5,11,PAL.a)+E(hx+5,hy-16,1.8,6.5,PAL.l);
  if(t==='pointy')return P('M'+(hx-9)+' '+(hy-5)+' L'+(hx-7)+' '+(hy-17)+' L'+(hx-1)+' '+(hy-8)+' Z',PAL.b)+P('M'+(hx+9)+' '+(hy-5)+' L'+(hx+7)+' '+(hy-17)+' L'+(hx+1)+' '+(hy-8)+' Z',PAL.b);
  if(t==='round')return C(hx-7,hy-9,4.5,PAL.a)+C(hx+7,hy-9,4.5,PAL.a);
  if(t==='floppy')return E(hx-9,hy-2,4,8,PAL.a)+E(hx+9,hy-2,4,8,PAL.a);
  if(t==='big')return E(hx-11,hy,6,9,PAL.a)+E(hx+11,hy,6,9,PAL.a);
  return '';
}
function tail(t,bx,by){
  if(t==='fluffy')return C(bx-19,by-4,4.5,PAL.w);
  if(t==='bigfluffy')return E(bx-20,by-10,5.5,9,PAL.w);
  if(t==='thin')return PL('M'+(bx-17)+' '+by+' C'+(bx-24)+' '+(by+2)+' '+(bx-25)+' '+(by+9)+' '+(bx-22)+' '+(by+12));
  if(t==='curl')return PL('M'+(bx-17)+' '+by+' c-6 0 -7 7 -3 7 c3 0 3 -4 0 -4');
  if(t==='flat')return P('M'+(bx-17)+' '+(by+2)+' l-8 3 l2 7 l8 -3 Z',PAL.a);
  return '';
}
function quad(o){
  o=o||{};var k=o.k||'dog',s='';
  function legs(xs,y1,y2,w){var r='';for(var i=0;i<xs.length;i++)r+=PL('M'+xs[i]+' '+y1+' L'+xs[i]+' '+y2,PAL.o,w||2.5);return r;}
  if(k==='cat'){
    s+=PL('M16 46 C7 42 7 28 15 26',PAL.b,4.5)+PL('M16 46 C7 42 7 28 15 26',PAL.o,1.3);
    s+=E(30,44,15,9,PAL.b)+legs([22,38],52,60);
    s+=P('M38 27 L40 17 L46 24 Z',PAL.b)+P('M47 24 L53 17 L54 27 Z',PAL.b);
    s+=C(46,31,9,PAL.b);
    if(o.stripes)s+=PL('M24 37 L24 44 M30 36 L30 43 M36 37 L36 44 M43 23 L43 27 M49 23 L49 27',PAL.a,2.2);
    if(o.spots)s+=Cd(24,41,2.2)+Cd(31,45,2)+Cd(37,40,1.8)+Cd(45,35,1.6);
    s+=Cd(43,29,1.7)+Cd(49,29,1.7)+E(51,34,2.2,1.6,PAL.n);
    s+=PL('M52 36 L60 34 M52 38 L60 40 M40 36 L33 34 M40 38 L33 40',PAL.o,1.1);
    return s;
  }
  if(k==='bun'){
    s+=C(15,47,4,PAL.w)+E(30,46,13,9,PAL.b)+legs([24,36],54,60);
    s+=E(40,22,4,10,PAL.a)+E(40,22,1.7,6,PAL.l)+E(48,22,4,10,PAL.a)+E(48,22,1.7,6,PAL.l);
    s+=C(44,35,8,PAL.b)+Cd(42,34,1.6)+Cd(47,34,1.6)+E(46,38,1.8,1.3,PAL.n);
    return s;
  }
  if(k==='dog'){
    s+=PL('M15 44 C9 40 9 32 14 30',PAL.b,4)+PL('M15 44 C9 40 9 32 14 30',PAL.o,1.2);
    s+=E(30,44,16,10,PAL.b)+legs([22,38],53,60);
    if(o.fluffy)s+=C(20,38,4,PAL.l)+C(28,35,4.5,PAL.l)+C(36,38,4,PAL.l);
    s+=E(37,27,4,8,PAL.a)+E(53,27,4,8,PAL.a);
    s+=C(45,31,9.5,PAL.b);
    if(o.top)s+=C(45,21,4.5,PAL.l);
    s+=E(52,34,4.5,3.8,PAL.l)+Cd(53,32.5,1.5);
    s+=Cd(42,28,1.7)+Cd(48,28,1.7);
    if(o.harness)s+=PL('M26 34 L34 52 M34 34 L26 52',PAL.o,2);
    return s;
  }
  if(k==='fox'||k==='wolf'){
    if(k==='fox'){s+=E(11,38,7.5,10,PAL.b)+C(5,31,3.2,PAL.w);}
    else{s+=E(11,44,6,8.5,PAL.b);}
    s+=E(30,44,15,9.5,PAL.b)+legs([23,37],53,60);
    s+=P('M39 26 L41 16 L46 23 Z',PAL.b)+P('M47 23 L52 16 L53 26 Z',PAL.b);
    s+=C(45,30,8.5,PAL.b);
    s+=P('M50 32 L59 36 L50 39 Z',PAL.l)+Cd(58,35.5,1.4);
    s+=Cd(43,28,1.7)+Cd(48,27.5,1.7);
    return s;
  }
  if(k==='rodent'){
    if(o.bigtail)s+=E(13,34,8,12,PAL.b)+E(10,26,4,6,PAL.a);
    else if(o.t==='flat')s+=P('M15 48 L4 52 L6 59 L17 54 Z',PAL.a);

var SPEED=45;
function hearts(x,y){
  if(reduced)return;
  var H=['\u2764\ufe0f','\ud83d\udc96','\u2728','\ud83d\udc97','\ud83c\udf38'];

  }

var RAWM=[],RAFL=false;
function rawmTick(){if(RAWM.length&&!RAFL){RAFL=true;requestAnimationFrame(rawmStep);}}
function rawmStep(t){
  RAFL=false;
  var vw=innerWidth,vh=innerHeight,run=false;
  for(var k=0;k<RAWM.length;k++){
    var m=RAWM[k];
    if(!m.el.isConnected)continue;
    run=true;
    if(m.last==null){m.last=t;continue;}
    var dt=Math.min((t-m.last)/1000,.5);m.last=t;
    m.x+=m.vx*dt;m.y+=m.vy*dt;
    if(m.x<0){m.x=0;m.vx=Math.abs(m.vx);}
    if(m.x>vw-m.w){m.x=vw-m.w;m.vx=-Math.abs(m.vx);}
    if(m.y<0){m.y=0;m.vy=Math.abs(m.vy);}
    if(m.y>vh-m.h){m.y=vh-m.h;m.vy=-Math.abs(m.vy);}
    if(m.vx<-.5)m.flip.style.transform='scaleX(-1)';
    else if(m.vx>.5)m.flip.style.transform='scaleX(1)';
    m.el.style.transform='translate('+m.x+'px,'+m.y+'px)';
  }
  if(run)requestAnimationFrame(rawmStep);
}
function spawn(idx){
  var rect=btn.getBoundingClientRect();
  var r=document.createElement('div');r.className=reduced?'ra':'ra pop';
  var flip=document.createElement('span');flip.className='flip';
  var s=document.createElement('span');s.className='ae';s.innerHTML=animalSVG(A[idx]);
  s.style.animationDelay=(-Math.random())+'s';
  try{
    var svg0=s.querySelector('svg');
    var g0=document.createElementNS('http://www.w3.org/2000/svg','g');
    while(svg0.firstChild)g0.appendChild(svg0.firstChild);
    svg0.appendChild(g0);
    var bb=g0.getBBox();
    if(bb.width>0&&bb.height>0){
      var sc=Math.min(56/bb.width,56/bb.height,1.9);
      var tx=(64-bb.width*sc)/2-bb.x*sc,ty=(64-bb.height*sc)/2-bb.y*sc;
      g0.setAttribute('transform','translate('+tx+','+ty+') scale('+sc+')');
    }
  }catch(e){}
  flip.appendChild(s);r.appendChild(flip);
  var tg=document.createElement('div');tg.className='rtag';tg.textContent=A[idx][0];
  r.appendChild(tg);
  roam.appendChild(r);
  var w=r.offsetWidth||52,h=r.offsetHeight||52;
  var vw=innerWidth,vh=innerHeight;
  var m={el:r,flip:flip,w:w,h:h,
    x:Math.min(Math.max(rect.left+rect.width/2-w/2,0),Math.max(vw-w,0)),
    y:Math.min(Math.max(rect.top-h-10,0),Math.max(vh-h,0)),
    vx:0,vy:0,last:null};
  var ang=Math.random()*Math.PI*2,sp=SPEED*(0.7+Math.random()*0.6);
  m.vx=Math.cos(ang)*sp;m.vy=Math.sin(ang)*sp;
  if(reduced){m.vx=0;m.vy=0;}
  m.el.style.transform='translate('+m.x+'px,'+m.y+'px)';
  if(m.vx<-.5)flip.style.transform='scaleX(-1)';
  RAWM.push(m);
  if(!reduced){
    setInterval(function(){
      if(!r.isConnected)return;
      var a2=Math.random()*Math.PI*2,s2=SPEED*(0.7+Math.random()*0.6);
      m.vx=Math.cos(a2)*s2;m.vy=Math.sin(a2)*s2;
    },2600+Math.random()*2200);
  }else{
    r.style.transition='transform 1.4s ease';
    setInterval(function(){
      if(!r.isConnected)return;
      m.x=Math.random()*Math.max(0,innerWidth-m.w);
      m.y=Math.random()*Math.max(0,innerHeight-m.h);
      m.el.style.transform='translate('+m.x+'px,'+m.y+'px)';
    },4000);
  }
  if(!reduced)setTimeout(function(){r.classList.remove('pop')},650);

  rawmTick();
  var kids=roam.querySelectorAll('.ra');
  if(kids.length>MAXROAM){
    var old=kids[0];old.classList.add('go');
    setTimeout(function(){
      old.remove();
      for(var q=RAWM.length-1;q>=0;q--){if(RAWM[q].el===old)RAWM.splice(q,1);}
    },900);
  }
  hearts(rect.left+rect.width/2,rect.top);
}

  i=(i+1)%A.length;

}
